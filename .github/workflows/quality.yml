name: Delivery consistency
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  coherent-delivery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check committed model, print project and receipt
        run: python tools/delivery.py
      - name: Exercise stale and partially staged delivery checks
        run: python -m unittest discover -s tools -p 'test_*.py' -v
